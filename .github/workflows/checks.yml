name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash scripts/build-mac.sh
      - run: bash scripts/test-mac.sh
