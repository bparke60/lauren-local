<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lauren · Desktop spirit</title>
    <link rel="stylesheet" href="/companion.css" />
  </head>
  <body>
    <main id="presence" data-state="idle" data-form="body">
      <aside id="bubble" role="status" aria-live="polite" hidden>
        <p id="caption"></p>
        <button
          id="dismiss"
          type="button"
          aria-label="Dismiss Lauren’s caption"
        >
          ×
        </button>
      </aside>
      <button
        id="character"
        type="button"
        aria-label="Lauren — click to talk, drag to move, right-click for options"
      >
        <canvas id="sprite" width="660" height="814" aria-hidden="true"></canvas
        ><span id="signal" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <span id="hint" hidden>Click to talk · drag to move</span>
    </main>
    <menu id="browserMenu" hidden>
      <button type="button" data-action="listen">Talk to Lauren</button
      ><button type="button" data-action="form">Change face / body</button
      ><button type="button" data-action="voice">Voice replies on / off</button
      ><a href="/tasks.html" target="_blank">Tasks &amp; lists ↗</a>
    </menu>
    <script type="module" src="/companion.js"></script>
  </body>
</html>
